<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Школьная библиотека</title>
  <meta name="description" content="Информационная система учёта выдачи книг в школьной библиотеке">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">

<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="#home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>
          <strong>Школьная библиотека</strong>
          <small>Учёт выдачи книг</small>
        </span>
      </a>
      <nav class="nav" aria-label="Главное меню">
        <a href="#home" data-route="home"><span class="ico">⌂</span>Главная</a>
        <a href="#issue" data-route="issue"><span class="ico">＋</span>Выдать книгу</a>

      </nav>
      <div class="sidebar-foot">
        <button class="btn-link" id="resetBtn" type="button">Сбросить демо-данные</button>
      </div>
    </aside>

    <main class="main" id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
